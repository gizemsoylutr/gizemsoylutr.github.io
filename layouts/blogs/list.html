<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - {{ .Site.Title }}</title>
    <meta name="description" content="All blog posts">
    <link rel="icon" href="{{ "images/favicon.jpg" | relURL }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f9fafb;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 3rem 2rem;
            text-align: center;
            color: white;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .blog-list {
            display: grid;
            gap: 2rem;
        }

        .blog-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .blog-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .blog-card h2 {
            color: #667eea;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .blog-meta {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .blog-summary {
            color: #4b5563;
            line-height: 1.7;
        }

        .blog-tags {
            margin-top: 1rem;
        }

        .tag {
            display: inline-block;
            background: #f3f4f6;
            padding: 0.3rem 0.6rem;
            border-radius: 15px;
            font-size: 0.8rem;
            margin-right: 0.5rem;
            color: #6b7280;
        }

        .home-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .container {
                padding: 0 1rem;
            }

            .blog-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Blog</h1>
        <p>Thoughts, tutorials, and insights</p>
    </header>

    <div class="container">
        <a href="/" class="home-link">← Back to home</a>

        <div class="blog-list">
            {{ range .Pages }}
            <a href="{{ .RelPermalink }}" class="blog-card">
                <h2>{{ .Title }}</h2>
                <div class="blog-meta">
                    <span>{{ .Date.Format "January 2, 2006" }}</span>
                    {{ if .ReadingTime }}
                    <span> • {{ .ReadingTime }} min read</span>
                    {{ end }}
                </div>
                <div class="blog-summary">{{ .Summary }}</div>
                {{ if .Params.tags }}
                <div class="blog-tags">
                    {{ range .Params.tags }}
                    <span class="tag">#{{ . }}</span>
                    {{ end }}
                </div>
                {{ end }}
            </a>
            {{ end }}
        </div>
    </div>
</body>
</html>
